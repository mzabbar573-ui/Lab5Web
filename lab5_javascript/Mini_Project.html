<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perhitungan Nilai Mahasiswa</title>
  </head>
  <body>
    <h2>Perhitungan Nilai Mahasiswa</h2>

    <form id="formNilai">
      <label for="tugas">Nilai Tugas:</label>
      <input type="number" id="tugas" min="0" max="100" step="any" required />
      <br /><br />

      <label for="uts">Nilai UTS:</label>
      <input type="number" id="uts" min="0" max="100" step="any" required />
      <br /><br />

      <label for="uas">Nilai UAS:</label>
      <input type="number" id="uas" min="0" max="100" step="any" required />
      <br /><br />

      <button type="submit">Hitung Nilai</button>
    </form>

    <div id="hasil">
      <h3>Hasil Perhitungan</h3>
      <p>Nilai akhir, predikat, dan status akan muncul di sini.</p>
    </div>

    <script src="Mini_Project.js"></script>
  </body>
</html>
